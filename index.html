<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aetheria — Mundo Expandido</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #05050a; color: #e0e0e0; user-select: none; }

  /* MENU */
  #tela-menu {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background: linear-gradient(180deg, #1a0a0a 0%, #2a0a0a 50%, #0a0505 100%);
    z-index: 200; padding: 20px; overflow: hidden;
  }
  .menu-logo {
    font-size: 82px; letter-spacing: 10px; font-weight: 900;
    color: #fff;
    text-shadow: -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 4px 4px 0 #000,
      0 8px 0 #7f1d1d, 0 0 50px #dc2626;
    margin-bottom: 8px; font-family: 'Arial Black', sans-serif;
    animation: flutuar 3s ease infinite;
  }
  @keyframes flutuar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .menu-sub {
    font-size: 14px; letter-spacing: 6px; color: #f87171;
    text-transform: uppercase; margin-bottom: 40px;
    text-shadow: 2px 2px 0 #000;
    background: rgba(0,0,0,0.6);
    padding: 10px 24px; border-radius: 20px;
    border: 3px solid #dc2626; font-weight: bold;
  }
  .menu-botoes { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 340px; }
  .menu-btn {
    padding: 16px 32px;
    background: linear-gradient(180deg, #dc2626, #7f1d1d);
    border: 4px solid #000; border-radius: 14px;
    color: #fff; font-size: 16px; font-weight: 900;
    letter-spacing: 3px; cursor: pointer;
    transition: all 0.15s; text-transform: uppercase;
    box-shadow: 0 6px 0 #000; font-family: 'Arial Black', sans-serif;
    text-shadow: 2px 2px 0 #000;
  }
  .menu-btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 0 #000;
    background: linear-gradient(180deg, #ef4444, #991b1b);
  }

  /* SELEÇÃO */
  #tela-selecao {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; overflow-y: auto; z-index: 100;
    background: linear-gradient(180deg, #1a0a0a 0%, #0a0505 100%);
    padding: 30px 20px;
  }
  #tela-selecao.ativo { display: flex; }
  .topo-selecao { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1400px; margin-bottom: 15px; }
  .topo-titulo {
    font-size: 28px; letter-spacing: 5px; color: #f87171;
    font-weight: 900; text-shadow: 3px 3px 0 #000;
    font-family: 'Arial Black', sans-serif;
  }
  .btn-voltar {
    padding: 10px 22px;
    background: linear-gradient(180deg, #6b7280, #4b5563);
    border: 3px solid #000; color: #fff;
    border-radius: 10px; font-size: 13px;
    cursor: pointer; font-weight: 900;
    letter-spacing: 2px; box-shadow: 0 4px 0 #000;
  }

  h2.categoria {
    font-size: 16px; letter-spacing: 4px;
    text-transform: uppercase;
    margin: 20px 0 15px;
    text-align: center; width: 100%; max-width: 1400px;
    font-family: 'Arial Black', sans-serif;
  }
  h2.categoria.classicos { color: #a78bfa; text-shadow: 2px 2px 0 #000; }
  h2.categoria.novos { color: #06b6d4; text-shadow: 2px 2px 0 #000; }

  .grid-herois {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px; max-width: 1400px; width: 100%;
  }
  .card-heroi {
    background: linear-gradient(180deg, var(--cor-bg-1), var(--cor-bg-2));
    border-radius: 18px; padding: 18px 12px;
    border: 4px solid var(--cor);
    cursor: pointer; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    text-align: center;
    box-shadow: 0 8px 0 rgba(0,0,0,0.5), 0 15px 40px var(--cor-glow);
  }
  .card-heroi:hover {
    transform: translateY(-10px) scale(1.03);
    box-shadow: 0 15px 0 rgba(0,0,0,0.5), 0 25px 60px var(--cor-glow);
  }
  .card-heroi .avatar-canvas {
    width: 120px; height: 120px;
    margin: 0 auto 10px;
    display: block; image-rendering: pixelated;
    filter: drop-shadow(0 0 12px var(--cor));
    animation: idlePersonagem 2s ease infinite;
  }
  @keyframes idlePersonagem {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .card-heroi .nome { font-size: 18px; color: #fff; margin-bottom: 3px; font-weight: 900; letter-spacing: 2px; text-shadow: 2px 2px 0 #000; font-family: 'Arial Black', sans-serif; }
  .card-heroi .classe { font-size: 10px; color: #fbbf24; margin-bottom: 8px; min-height: 24px; letter-spacing: 1px; font-weight: bold; }
  .card-heroi .stats-mini { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; font-size: 10px; color: #fff; }
  .card-heroi .stats-mini span { background: rgba(0,0,0,0.5); padding: 3px 7px; border-radius: 10px; border: 2px solid var(--cor); font-weight: bold; }
  .card-heroi .btn { padding: 10px; background: linear-gradient(180deg, #ffd700, #fbbf24); color: #000; font-weight: 900; border: 3px solid #000; border-radius: 10px; font-size: 11px; letter-spacing: 3px; box-shadow: 0 4px 0 #000; font-family: 'Arial Black', sans-serif; }

  /* JOGO */
  #jogo { position: fixed; inset: 0; display: none; }
  #jogo.ativo { display: block; }
  #canvas { display: block; image-rendering: pixelated; }

  /* HUD */
  .hud-topo { position: absolute; top: 0; left: 0; right: 0; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; pointer-events: none; }
  .hud-heroi { display: flex; align-items: center; gap: 12px; pointer-events: auto; background: rgba(0,0,0,0.7); border: 3px solid #000; border-radius: 14px; padding: 8px 14px 8px 8px; box-shadow: 0 4px 0 #000; }
  .hud-avatar-canvas { width: 56px; height: 56px; image-rendering: pixelated; filter: drop-shadow(0 0 8px var(--cor)); display: block; }
  .hud-nome { font-size: 15px; color: #fff; font-weight: 900; letter-spacing: 1px; text-shadow: 2px 2px 0 #000; font-family: 'Arial Black', sans-serif; }
  .hud-cap { font-size: 11px; color: #fbbf24; margin-top: 2px; font-weight: bold; }
  .hud-barras { display: flex; gap: 8px; pointer-events: auto; background: rgba(0,0,0,0.7); border: 3px solid #000; border-radius: 14px; padding: 8px 12px; box-shadow: 0 4px 0 #000; }
  .hud-barra { width: 110px; height: 18px; background: #1a1a1a; border-radius: 9px; border: 2px solid #000; overflow: hidden; position: relative; }
  .hud-barra-fill { height: 100%; transition: width 0.3s; }
  .hud-hp { background: linear-gradient(180deg, #ff5757, #dc2626); }
  .hud-mp { background: linear-gradient(180deg, #60a5fa, #2563eb); }
  .hud-xp { background: linear-gradient(180deg, #34d399, #10b981); }
  .hud-barra-txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: #fff; text-shadow: 1px 1px 0 #000; font-family: 'Arial Black', sans-serif; }

  .hud-local {
    position: absolute; top: 100px; left: 20px;
    background: rgba(0,0,0,0.8); border: 3px solid #000; border-radius: 12px;
    padding: 12px 16px; z-index: 10; max-width: 240px;
    box-shadow: 0 4px 0 #000; border-left: 6px solid var(--cor);
  }
  .hud-local-tipo { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #fbbf24; margin-bottom: 4px; font-weight: bold; }
  .hud-local-nome { font-size: 14px; color: #fff; font-weight: 900; margin-bottom: 6px; font-family: 'Arial Black', sans-serif; }
  .hud-local-desc { font-size: 10px; color: #b0b0b0; line-height: 1.4; padding-top: 6px; border-top: 1px dashed #374151; }

  .hud-equip {
    position: absolute; top: 100px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85); border: 3px solid #fbbf24;
    border-radius: 12px; padding: 8px 14px;
    display: flex; gap: 10px; align-items: center;
    z-index: 10; box-shadow: 0 4px 0 #000;
  }
  .hud-equip-item { display: flex; align-items: center; gap: 5px; padding: 4px 8px; background: rgba(0,0,0,0.5); border-radius: 8px; border: 2px solid #4b5563; font-size: 11px; font-weight: bold; }
  .hud-equip-item.ativo { border-color: #fbbf24; box-shadow: 0 0 10px rgba(251,191,36,0.5); }
  .hud-equip-icone { font-size: 18px; }
  .hud-equip-nome { color: #fff; font-size: 10px; }

  .hud-minimapa { position: absolute; top: 180px; right: 20px; width: 240px; height: 200px; background: rgba(0,0,0,0.85); border: 3px solid #000; border-radius: 12px; z-index: 10; overflow: hidden; box-shadow: 0 4px 0 #000; }
  .hud-minimapa canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

  .hud-monstro { position: absolute; top: 180px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.95); border: 4px solid #dc2626; border-radius: 14px; padding: 14px 22px; z-index: 12; display: none; min-width: 340px; box-shadow: 0 6px 0 #000; }
  .hud-monstro.ativo { display: block; }
  .hud-monstro-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .hud-monstro-nome { font-size: 15px; font-weight: 900; color: #fff; text-shadow: 2px 2px 0 #000; letter-spacing: 1px; font-family: 'Arial Black', sans-serif; }
  .hud-monstro-tag { font-size: 9px; padding: 4px 10px; border-radius: 8px; background: #000; color: #f87171; border: 2px solid #dc2626; text-transform: uppercase; font-weight: bold; letter-spacing: 2px; }
  .hud-monstro-barra { height: 16px; background: #000; border-radius: 8px; overflow: hidden; border: 2px solid #7f1d1d; }
  .hud-monstro-fill { height: 100%; background: linear-gradient(180deg, #ff5757, #dc2626); transition: width 0.3s; }
  .hud-monstro-txt { text-align: center; font-size: 11px; color: #fbbf24; margin-top: 6px; font-weight: bold; }

  .hud-habilidades { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(0,0,0,0.85); border: 3px solid #000; border-radius: 14px; padding: 10px 14px; z-index: 10; pointer-events: auto; box-shadow: 0 4px 0 #000; }
  .hab-slot { width: 56px; height: 56px; background: linear-gradient(180deg, #2a2a3e, #1a1a2e); border: 3px solid #000; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; position: relative; flex-shrink: 0; box-shadow: 0 3px 0 #000; }
  .hab-slot:hover { transform: translateY(-4px); box-shadow: 0 7px 0 #000; border-color: var(--cor); }
  .hab-slot.travada { opacity: 0.4; }
  .hab-slot.cooldown { opacity: 0.5; }
  .hab-icone { font-size: 22px; }
  .hab-nome { font-size: 7px; color: #fff; margin-top: 2px; text-align: center; line-height: 1; font-weight: bold; }
  .hab-custo { position: absolute; top: 3px; right: 5px; font-size: 10px; color: #60a5fa; font-weight: 900; text-shadow: 1px 1px 0 #000; }
  .hab-tecla { position: absolute; bottom: 3px; right: 5px; font-size: 9px; background: #fbbf24; color: #000; font-weight: 900; padding: 1px 5px; border-radius: 4px; border: 2px solid #000; }

  .hud-inventario { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.85); border: 3px solid #fbbf24; border-radius: 12px; padding: 10px 14px; z-index: 10; max-width: 300px; pointer-events: auto; box-shadow: 0 4px 0 #000; }
  .hud-inventario-titulo { font-size: 11px; color: #fbbf24; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; display: flex; justify-content: space-between; font-weight: 900; }
  .hud-inventario-grid { display: flex; gap: 6px; flex-wrap: wrap; }
  .hud-inv-item { width: 40px; height: 40px; background: linear-gradient(180deg, #2a2a3e, #1a1a2e); border: 3px solid #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; position: relative; box-shadow: 0 2px 0 #000; }
  .hud-inv-item .qtd { position: absolute; bottom: -3px; right: 0; font-size: 10px; color: #fff; font-weight: 900; background: #000; padding: 0 5px; border-radius: 6px; border: 2px solid #fbbf24; }
  .hud-inv-vazio { font-size: 11px; color: #6b7280; font-style: italic; padding: 6px; }

  .hud-inferior { position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 20px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 10; pointer-events: none; }
  .hud-controles { font-size: 11px; color: #fff; background: rgba(0,0,0,0.75); padding: 10px 14px; border-radius: 10px; border: 3px solid #000; pointer-events: auto; font-weight: bold; box-shadow: 0 4px 0 #000; }
  .hud-controles b { color: #fbbf24; }
  .hud-ouro { font-size: 14px; color: #fbbf24; background: rgba(0,0,0,0.75); padding: 10px 16px; border-radius: 10px; border: 3px solid #000; font-weight: 900; pointer-events: auto; box-shadow: 0 4px 0 #000; }

  .btn-menu-jogo { position: absolute; top: 100px; right: 280px; width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(180deg, #ffd700, #fbbf24); border: 3px solid #000; color: #000; font-size: 24px; cursor: pointer; z-index: 12; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #000; font-weight: 900; }
  .btn-menu-jogo:hover { transform: translateY(-3px); box-shadow: 0 7px 0 #000; }

  .notificacao { position: absolute; top: 90px; left: 50%; transform: translateX(-50%) translateY(-30px); background: linear-gradient(180deg, #1a0a0a, #0a0505); border: 3px solid #dc2626; border-radius: 12px; padding: 12px 24px; font-size: 14px; color: #f87171; font-weight: 900; opacity: 0; pointer-events: none; transition: all 0.4s; z-index: 20; box-shadow: 0 6px 0 #000; font-family: 'Arial Black', sans-serif; }
  .notificacao.ativa { opacity: 1; transform: translateX(-50%) translateY(0); }

  .dano-flutuante { position: absolute; font-size: 22px; font-weight: 900; pointer-events: none; z-index: 25; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000; animation: subirDano 1.2s forwards; font-family: 'Arial Black', sans-serif; }
  @keyframes subirDano {
    0% { transform: translateY(0) scale(0.3); opacity: 0; }
    15% { transform: translateY(-12px) scale(1.4); opacity: 1; }
    100% { transform: translateY(-70px) scale(0.9); opacity: 0; }
  }
  .dano-critico { font-size: 32px; color: #fbbf24; }
  .dano-normal { color: #ff5757; }
  .dano-jogador { color: #f87171; }
  .dano-cura { color: #34d399; }

  /* INVENTÁRIO */
  .inv-overlay { position: absolute; inset: 0; display: none; justify-content: center; align-items: center; background: rgba(0,0,0,0.95); backdrop-filter: blur(12px); z-index: 90; padding: 20px; }
  .inv-overlay.ativo { display: flex; }
  .inv-modal { background: linear-gradient(180deg, #1a0a0a, #0a0505); border: 5px solid #fbbf24; border-radius: 24px; padding: 30px; max-width: 1100px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 0 #000; }
  .inv-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 3px solid #fbbf24; }
  .inv-titulo { font-size: 26px; color: #fbbf24; letter-spacing: 4px; font-weight: 900; font-family: 'Arial Black', sans-serif; }
  .inv-btn-fechar { width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(180deg, #dc2626, #7f1d1d); border: 3px solid #000; color: #fff; font-size: 22px; cursor: pointer; font-weight: 900; box-shadow: 0 4px 0 #000; }
  .inv-secoes { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
  .inv-secao { background: rgba(0,0,0,0.5); border: 3px solid #4b5563; border-radius: 14px; padding: 16px; }
  .inv-secao-titulo { font-size: 16px; color: #fbbf24; margin-bottom: 12px; letter-spacing: 2px; font-weight: 900; text-transform: uppercase; font-family: 'Arial Black', sans-serif; }
  .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
  .inv-slot { aspect-ratio: 1; background: linear-gradient(180deg, #2a2a3e, #1a1a2e); border: 3px solid #4b5563; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 36px; position: relative; cursor: pointer; transition: 0.15s; box-shadow: 0 3px 0 #000; }
  .inv-slot:hover { transform: translateY(-4px); border-color: #fbbf24; box-shadow: 0 7px 0 #000; }
  .inv-slot.equipado { border-color: #10b981; box-shadow: 0 0 15px rgba(16,185,129,0.7); }
  .inv-slot.vazio { opacity: 0.4; cursor: default; }
  .inv-slot.vazio:hover { transform: none; border-color: #4b5563; }
  .inv-slot-raridade { position: absolute; top: 3px; left: 3px; font-size: 8px; padding: 2px 5px; border-radius: 4px; font-weight: 900; text-transform: uppercase; }
  .inv-slot-nome { position: absolute; bottom: -14px; left: 0; right: 0; text-align: center; font-size: 8px; color: #fff; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inv-slot-qtd { position: absolute; bottom: 3px; right: 3px; font-size: 10px; color: #fff; font-weight: 900; background: #000; padding: 0 5px; border-radius: 6px; border: 2px solid #fbbf24; }
  .inv-filtros { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
  .inv-filtro { padding: 6px 14px; background: linear-gradient(180deg, #2a2a3e, #1a1a2e); border: 2px solid #4b5563; border-radius: 8px; color: #9ca3af; font-weight: 900; font-size: 11px; cursor: pointer; transition: 0.15s; text-transform: uppercase; letter-spacing: 1px; }
  .inv-filtro:hover { border-color: #fbbf24; color: #fbbf24; }
  .inv-filtro.ativo { background: linear-gradient(180deg, #fbbf24, #d97706); color: #000; border-color: #000; }
  .inv-info-painel { margin-top: 20px; background: rgba(0,0,0,0.6); border: 3px solid #fbbf24; border-radius: 14px; padding: 16px; min-height: 100px; }
  .inv-info-titulo { font-size: 18px; color: #fbbf24; font-weight: 900; margin-bottom: 8px; font-family: 'Arial Black', sans-serif; }
  .inv-info-desc { font-size: 13px; color: #b0b0b0; font-style: italic; margin-bottom: 10px; line-height: 1.5; }
  .inv-info-stats { display: flex; gap: 15px; flex-wrap: wrap; }
  .inv-info-stat { background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 8px; border: 2px solid #4b5563; font-size: 12px; font-weight: bold; color: #fff; }
  .inv-info-stat b { color: #34d399; }

  .levelup-overlay { position: absolute; inset: 0; display: none; justify-content: center; align-items: center; background: radial-gradient(circle, rgba(251,191,36,0.3), rgba(0,0,0,0.95)); backdrop-filter: blur(12px); z-index: 70; padding: 20px; }
  .levelup-overlay.ativo { display: flex; }
  .levelup-modal { background: linear-gradient(180deg, #1a1a2e, #0a0a14); border: 5px solid #fbbf24; border-radius: 24px; padding: 40px 35px; max-width: 520px; width: 100%; text-align: center; box-shadow: 0 8px 0 #000; }
  .levelup-titulo { font-size: 40px; color: #fbbf24; letter-spacing: 6px; text-shadow: 3px 3px 0 #000; margin-bottom: 8px; font-weight: 900; font-family: 'Arial Black', sans-serif; }
  .levelup-nivel { font-size: 20px; color: #fff; margin-bottom: 30px; letter-spacing: 3px; font-weight: bold; }
  .levelup-nivel b { color: #fbbf24; font-size: 30px; }
  .levelup-bonus { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 25px; }
  .bonus-item { background: #0a0a14; border: 3px solid #4b5563; border-radius: 12px; padding: 14px 8px; }
  .bonus-label { font-size: 11px; color: #9ca3af; text-transform: uppercase; margin-bottom: 6px; font-weight: bold; }
  .bonus-valor { font-size: 22px; color: #34d399; font-weight: 900; font-family: 'Arial Black', sans-serif; }
  .levelup-btn { padding: 16px 50px; background: linear-gradient(180deg, #ffd700, #fbbf24); border: 4px solid #000; border-radius: 14px; color: #000; font-weight: 900; letter-spacing: 5px; font-size: 16px; cursor: pointer; text-transform: uppercase; box-shadow: 0 6px 0 #000; font-family: 'Arial Black', sans-serif; }

  .dialogo-overlay { position: absolute; inset: 0; display: none; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); z-index: 50; padding: 20px; }
  .dialogo-overlay.ativo { display: flex; }
  .dialogo { background: linear-gradient(180deg, #1a0a0a, #0a0505); border: 4px solid #dc2626; border-radius: 18px; padding: 28px; max-width: 560px; width: 90%; box-shadow: 0 8px 0 #000; }
  .dlg-titulo { font-size: 20px; color: #f87171; margin-bottom: 12px; font-weight: 900; font-family: 'Arial Black', sans-serif; }
  .dlg-texto { font-size: 14px; line-height: 1.7; color: #e0e0e0; margin-bottom: 22px; padding: 14px; background: #0a0505; border-radius: 10px; border-left: 4px solid #dc2626; font-style: italic; }
  .dlg-acoes { display: flex; gap: 12px; flex-wrap: wrap; }
  .dlg-btn { flex: 1; min-width: 100px; padding: 12px 16px; border-radius: 10px; border: 3px solid #000; background: linear-gradient(180deg, #4b5563, #374151); color: #fff; font-weight: 900; cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 4px 0 #000; font-family: 'Arial Black', sans-serif; }
